 function studioVideo(s){return `<main class="studio-page editing"><header class="studio-context"><div class="row"><span>打击动作研究</span><small>/ ANALYSIS</small></div><div class="row">${btn('annotate','标注','pen-tool')}${btn('export','导出','arrow-up-right','cta')}</div></header><div class="studio-video-stage">${actionScene(s.frame)}<div class="floating-tools">${btn('annotate','画线','pen-line')}${btn('keyframe','关键帧','bookmark')}${btn('s-compare','对比','columns-2')}</div><span class="studio-time" data-frame>00:00:01:${String(s.frame%30).padStart(2,'0')}</span></div><div class="studio-timeline"><div class="row between"><div class="row">${btn('prev','−1 帧')}${btn('play',s.playing?'暂停':'播放',s.playing?'pause':'play')}${btn('next','＋1 帧')}</div><div class="row">${btn('speed','0.5×')}<small data-time>FRAME ${String(s.frame).padStart(3,'0')} / 120</small></div></div><div class="studio-ruler"><span>00:00</span><span>00:01</span><span>00:02</span><span>00:03</span><span>00:04</span></div><div class="studio-clips">${Array.from({length:20},(_,n)=>`<span>${actionScene(n*6,true)}</span>`).join('')}</div><div class="range-control"><small>V1</small><input type="range" min="0" max="120" value="${s.frame}" data-setting="timeline" aria-label="专业时间轴"></div></div>${notice()}</main>`;}
 function buddyHeader(s){return `<header class="buddy-header"><div class="buddy-lockup"><img src="${APP_ICON}" alt="棒球训练助手图标"><div class="buddy-name">Drill <span>Buddy</span><small>棒球训练助手</small></div></div><div class="row"><span class="muted" style="font-size:11px">把每一次练习看清楚</span>${btn('home',s.page==='home'?'我的练习':'回到首页',s.page==='home'?'folder-heart':'house')}</div></header>`;}
 function buddyHome(){return `<main class="buddy-content"><div class="buddy-heading"><h1>今天，怎么练？</h1><p>一个动作，一张战术图。陪你把练习讲明白。</p></div><div class="buddy-tasks"><button class="buddy-task cursor-interaction" data-action="video"><span class="task-no">01</span><div><h2>看清一个动作</h2><small>选视频 → 找关键一帧 → 画出要点</small></div><div class="task-art">${actionScene(48,true)}</div>${i('arrow-right')}</button><button class="buddy-task cursor-interaction" data-action="board"><span class="task-no">02</span><div><h2>一起讲个战术</h2><small>摆好位置 → 画条路线 → 保存图片</small></div><div class="task-art">${field()}</div>${i('arrow-right')}</button><button class="buddy-task cursor-interaction" data-action="b-timer"><span class="task-no">03</span><div><h2>专心练一会儿</h2><small>开个计时器，专注眼前的练习</small></div><div class="task-art" style="display:flex;align-items:center;justify-content:center;font:italic 35px Georgia,serif;color:#722f37">05:00</div>${i('arrow-right')}</button></div><div class="buddy-resume"><span>最近练习 · 内野防守站位</span>${btn('b-resume','继续上次练习','arrow-up-right')}</div><nav class="buddy-footer">${btn('b-records','我的练习记录','notebook-pen')}${btn('b-help','怎么使用','circle-help')}</nav>${notice()}</main>`;}
 const steps=(s,video=false)=>`<div class="buddy-steps"><span class="${s.step===1?'now':''}">① ${video?'找关键一帧':'摆好位置'}</span><span class="step-dot"></span><span class="${s.step===2?'now':''}">② ${video?'画出要点':'画出路线'}</span><span class="step-dot"></span><span>③ 保存分享</span></div>`;
 function buddyBoard(s){return `<main class="buddy-work">${steps(s)}<div class="buddy-heading"><h1>${s.step===1?'先告诉大家，站在哪里。':'接下来，画出怎么移动。'}</h1></div><div class="buddy-work-grid"><div class="buddy-board">${field(true)}</div><aside class="buddy-help"><h3>${s.step===1?'拖一拖球员':'把想法画下来'}</h3><p>${s.step===1?'把场上的圆点拖到合适的位置。讲完站位，再画跑动路线。':'用手指试画一条路线。画错了可以撤销。'}</p>${s.step===1?btn('b-reset','恢复默认站位','rotate-ccw'):penActions()}</aside></div><div class="buddy-next"><small>内野协防 · 示例白板</small>${btn(s.step===1?'b-step':'finish',s.step===1?'位置好了，下一步':'完成，保存战术图','arrow-right','cta')}</div>${notice()}</main>`;}
 function buddyVideo(s){return `<main class="buddy-work">${steps(s,true)}<div class="buddy-heading"><h1>${s.step===1?'慢一点，找到想说的那一刻。':'把想提醒的地方标出来。'}</h1></div><div class="buddy-video-layout"><div><div class="buddy-video-frame">${actionScene(s.frame)}</div><div class="buddy-video-controls"><div class="range-control"><small data-time>01.60 秒</small><input type="range" min="0" max="120" value="${s.frame}" data-setting="timeline" aria-label="寻找关键帧"></div><div class="row between">${btn('prev','往前一帧','chevron-left')}${btn('play',s.playing?'暂停':'慢放看看',s.playing?'pause':'play')}${btn('next','往后一帧','chevron-right')}</div></div></div><aside class="buddy-cue"><strong>${s.step===1?'不用一次看完':'一次只讲一个要点'}</strong><p>${s.step===1?'拖动进度条，停在你想讨论的地方。用前后帧按钮，再微调一下。':'点击下方按钮，查看标注后的关键帧示意。完成后保存这次观察。'}</p>${s.step===2?btn('annotate','标出这个要点','pen-line'):''}</aside></div><div class="buddy-next"><small>打击练习 · 示例视频</small>${btn(s.step===1?'b-step':'finish',s.step===1?'就是这一帧，下一步':'保存这次观察','arrow-right','cta')}</div>${notice()}</main>`;}
 function buddyFinish(s){return `<main class="buddy-work"><div class="buddy-finish"><span class="finish-mark">✓</span><h1>这次练习，留住了。</h1><p class="muted">完成页设计预览 · 没有写入真实记录或相册</p><div class="row">${btn('home','回到练习','','cta')}${btn('b-again','再看一遍')}</div></div></main>`;}
 function render(app){const key=app.dataset.world,s=state[key];let content='';
 if(key==='native')content=`<div class="native-shell">${nativeSide(s.page)}<div class="native-page">${s.page==='board'?nativeBoard():s.page==='video'?nativeVideo(s):nativeHome(s)}</div></div>`;
 if(key==='studio')content=`<header class="studio-header"><div class="studio-brand"><img class="studio-brand-icon" src="${APP_ICON}" alt="">DRILL<span> BUDDY</span><div class="eyebrow" style="margin-top:6px">棒球训练助手 / STUDIO CONCEPT</div></div><div class="row"><small>本机项目</small>${btn('home','项目总览','layout-grid')}</div></header><div class="studio-shell">${studioRail(s)}${s.page==='board'?studioBoard(s):s.page==='video'?studioVideo(s):studioHome()}</div>`;
 if(key==='buddy')content=buddyHeader(s)+(s.page==='board'?buddyBoard(s):s.page==='video'?buddyVideo(s):s.page==='finish'?buddyFinish(s):buddyHome());
 app.innerHTML=status()+content+'<div class="indicator"></div>';if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});wireField(app);if(s.mode==='draw')selectMode(app,'draw');
 }
 function tell(app,text){const n=app.querySelector('.notice');if(n)n.textContent=text;}
 function selectMode(app,mode){state[app.dataset.world].mode=mode;app.querySelectorAll('[data-action="move"],[data-action="draw"]').forEach(b=>b.classList.toggle('active',b.dataset.action===mode));}
 function updateFrame(app){const s=state[app.dataset.world];app.querySelectorAll('.video-frame,.studio-video-stage,.buddy-video-frame').forEach(el=>{const scene=el.querySelector('.action-scene');if(scene){const hold=document.createElement('div');hold.innerHTML=actionScene(s.frame);scene.replaceWith(hold.firstElementChild);}});const inp=app.querySelector('[data-setting="timeline"]');if(inp)inp.value=s.frame;const t=app.querySelector('[data-time]');if(t)t.textContent=app.dataset.world==='studio'?`FRAME ${String(s.frame).padStart(3,'0')} / 120`:(s.frame/30).toFixed(2)+' 秒';const code=app.querySelector('[data-frame]');if(code)code.textContent=`00:00:${String(Math.floor(s.frame/30)).padStart(2,'0')}:${String(s.frame%30).padStart(2,'0')}`;}
 function wireField(app){const svg=app.querySelector('[data-interactive-field]');if(!svg)return;let target=null,line=null;const s=state[app.dataset.world];if(s.positions)svg.querySelectorAll('[data-player]').forEach(p=>{if(s.positions[p.dataset.player])p.setAttribute('transform',s.positions[p.dataset.player]);});if(s.strokes)svg.querySelector('[data-strokes]').innerHTML=s.strokes;const pt=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse());};
 svg.addEventListener('pointerdown',e=>{const p=pt(e);if(s.mode==='draw'){line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',`M${p.x} ${p.y}`);line.setAttribute('stroke','var(--wine)');line.setAttribute('stroke-width',s.pen);line.setAttribute('fill','none');line.setAttribute('stroke-linecap','round');svg.querySelector('[data-strokes]').append(line);}else target=e.target.closest('[data-player]');svg.setPointerCapture(e.pointerId);});
 svg.addEventListener('pointermove',e=>{if(!line&&!target)return;const p=pt(e);if(target)target.setAttribute('transform',`translate(${Math.max(16,Math.min(584,p.x))} ${Math.max(16,Math.min(394,p.y))})`);if(line)line.setAttribute('d',line.getAttribute('d')+` L${p.x} ${p.y}`);});const stop=()=>{s.positions=Object.fromEntries([...svg.querySelectorAll('[data-player]')].map(p=>[p.dataset.player,p.getAttribute('transform')]));s.strokes=svg.querySelector('[data-strokes]').innerHTML;target=null;line=null;};svg.addEventListener('pointerup',stop);svg.addEventListener('pointercancel',stop);}

 ['Q01','秒表','开始、暂停、分段计时','timer','available'],['Q02','倒计时','设定时长，即刻开始','alarm-clock','available'],['Q03','战术白板','摆放球员，画下路线','pen-tool','board'],['Q04','测距','AR 实景距离估算','ruler','available']]}
 };
 function studioRail(s){const selected=s.scene||'personal';return `<nav class="studio-rail" aria-label="功能模块"><small class="rail-section">功能模块</small>${Object.entries(scenes).map(([key,v])=>btn('scene-'+key,v.name,v.icon,s.page!=='records'&&selected===key?'active':'')).join('')}<div class="rail-bottom"><small class="rail-section">公共入口</small>${btn('records','全部记录','folder',s.page==='records'?'active':'')}${btn('s-settings','设置','settings-2')}</div></nav>`;}
 function studioHome(){const s=state.studio,scene=scenes[s.scene||'personal'];return `<main class="studio-page"><div class="studio-title"><div><div class="eyebrow">DRILL BUDDY / 工具箱</div><h1 style="margin-top:12px">${scene.name}</h1><small>${scene.sub}。${scene.hint}。</small></div><span class="module-count">${scene.tools.length} 项工具</span></div><div class="module-tools">${scene.tools.map(([code,name,desc,icon,mode])=>`<button class="module-tool cursor-interaction ${mode==='pending'?'pending':''}" data-action="tool-${code}"><div class="row between"><span class="module-symbol">${i(icon)}</span><small>${code}</small></div><h2>${name}</h2><p>${desc}</p><div class="row between"><small>${mode==='pending'?'内容待完善':code==='Q04'?'已接入 · 真机精度待验收':'已有功能'}</small>${i('arrow-up-right')}</div></button>`).join('')}</div><div class="studio-strip"><span>${scene.name}的记录</span>${btn('records','查看记录','arrow-right')}</div><div class="module-record">${s.scene==='quick'?btn('tool-Q03','内野防守站位　 ·　 白板草稿示例','pen-tool'):s.scene==='team'?'<span class="muted">团训工具内容完善后，在这里继续查看训练记录。</span>':btn('tool-P01','打击练习　 ·　 视频分析示例','clapperboard')}</div>${notice()}</main>`;}
 const originalRender=render;
 render=function(app){
  const s=state[app.dataset.world];
  if(app.dataset.world==='studio'&&!s.scene)s.scene='personal';
  originalRender(app);
  if(app.dataset.world!=='studio')return;
  app.classList.toggle('tool-open',!['home','records'].includes(s.page));
  const top=app.querySelector('.studio-header .row');
  top.innerHTML=`<small>iPad 优先 / iPhone 保留</small>${btn('home','工具箱','layout-grid')}`;
  const context=app.querySelector('.studio-context');
  if(context)context.insertAdjacentHTML('beforebegin',`<div class="module-crumb">${btn('scene-'+s.scene,scenes[s.scene].name,'chevron-left')}<span>／ ${s.page==='board'?'战术白板':'视频分析'}</span></div>`);
  if(s.page==='records')app.querySelector('.studio-page').innerHTML=`<div class="studio-title"><div><div class="eyebrow">LIBRARY / 公共入口</div><h1 style="margin-top:12px">全部记录</h1><small>按私教、团训、随手工具及具体工具筛选。</small></div></div><div class="records-filter">${Object.entries(scenes).map(([k,v])=>btn('recordfilter-'+k,v.name,'',s.recordScene===k?'active':'')).join('')}</div><div class="module-record">${s.recordScene==='team'?'<p>团训记录待对应工具接入。</p>':s.recordScene==='quick'?btn('tool-Q03','内野防守站位　 ·　 随手工具 / 战术白板','pen-tool'):btn('tool-P01','打击练习　 ·　 私教 / 视频分析','clapperboard')}</div>${notice()}`;
  if(s.page==='pending'){
   const t=scenes[s.scene].tools.find(t=>t[0]===s.tool);
   app.querySelector('.studio-page').innerHTML=`<div class="module-crumb">${btn('scene-'+s.scene,scenes[s.scene].name,'chevron-left')}</div><div class="pending-detail"><span class="module-symbol">${i(t[3])}</span><h1>${t[1]}</h1><p>${t[2]}</p><small>${t[4]==='pending'?'入口保留，内容待完善。':'已有原生功能，本次先评审功能结构与入口。'}</small></div>${notice()}`;
  }
  if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});
 };
 root.addEventListener('click',e=>{
  const app=e.target.closest('[data-world="studio"]'),b=e.target.closest('[data-action]');if(!app||!b)return;
  const a=b.dataset.action,s=state.studio;
  if(a.startsWith('scene-')){s.scene=a.slice(6);s.page='home';}
  else if(a.startsWith('tool-')){s.tool=a.slice(5);s.scene=Object.keys(scenes).find(k=>scenes[k].tools.some(t=>t[0]===s.tool));const t=scenes[s.scene].tools.find(t=>t[0]===s.tool);s.page=t[4]==='board'?'board':t[4]==='video'?'video':'pending';}
  else if(a==='records'){s.page='records';s.recordScene=s.scene;}
  else if(a.startsWith('recordfilter-')){s.recordScene=a.slice(13);}
  else return;
  e.stopImmediatePropagation();clearInterval(s.timer);s.playing=false;s.mode='move';render(app);
  window.openai?.setWidgetState?.({modelContent:{scene:scenes[s.scene].name,page:s.page,iPhoneSupported:true},privateContent:{scene:s.scene,page:s.page}})?.catch(()=>{});
 },true);

 root.querySelectorAll('.product').forEach(app=>{const key=app.dataset.world,v=stored[key]||{};state[key]={page:['home','board','video','finish'].includes(v.page)?v.page:'home',filter:v.filter||'all',frame:48,step:v.step===2?2:1,mode:'move',pen:3,playing:false,inspector:false};render(app);
 app.addEventListener('input',e=>{const s=state[key];if(e.target.dataset.setting==='timeline'){s.frame=Number(e.target.value);updateFrame(app);}if(e.target.dataset.setting==='pen')s.pen=Number(e.target.value);});
 app.addEventListener('change',e=>{if(e.target.dataset.setting==='field'){const svg=app.querySelector('[data-interactive-field]');svg.querySelectorAll('[data-player]').forEach(p=>{p.style.opacity=e.target.value==='仅内野'&&['左','中','右'].includes(p.dataset.player)?'.15':'1';});}});
 app.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,s=state[key];
 if(['home','board','video'].includes(a)){clearInterval(s.timer);s.playing=false;s.page=a;s.step=1;s.mode='move';render(app);persist();}
 else if(a.startsWith('filter-')){s.filter=a.slice(7);render(app);persist();}
 else if(a==='draw'||a==='move'){selectMode(app,a);tell(app,a==='draw'?'可以在球场上试画；撤销可移除最后一笔。':'拖动场上球员调整站位。');}
 else if(a==='undo'){app.querySelector('[data-strokes]')?.lastElementChild?.remove();s.strokes=app.querySelector('[data-strokes]')?.innerHTML||'';}
 else if(a==='clear'){app.querySelector('[data-strokes]')?.replaceChildren();s.strokes='';}
 else if(a==='b-reset'){s.positions=null;s.strokes='';render(app);tell(app,'站位已恢复为示例阵容。');}
 else if(a==='b-resume'){s.page='board';s.step=2;s.mode='draw';render(app);persist();}
 else if(a==='b-step'){s.step=2;if(s.page==='board')s.mode='draw';render(app);persist();}
 else if(a==='finish'){s.lastPage=s.page;s.page='finish';clearInterval(s.timer);s.playing=false;render(app);persist();}
 else if(a==='b-again'){s.page=s.lastPage||'board';s.step=1;s.mode='move';render(app);}
 else if(a==='prev'||a==='next'){s.frame=Math.max(0,Math.min(120,s.frame+(a==='prev'?-1:1)));updateFrame(app);}
 else if(a==='play'){s.playing=!s.playing;b.innerHTML=s.playing?'暂停':'播放';clearInterval(s.timer);if(s.playing)s.timer=setInterval(()=>{if(!s.playing)return;s.frame=s.frame>=120?0:s.frame+1;updateFrame(app);},140);tell(app,'固定静帧与时间计数仅演示控件；真实播放仍由现有原生引擎提供。');}
 else if(a==='annotate'){const svg=app.querySelector('.video-frame .action-scene,.studio-video-stage .action-scene,.buddy-video-frame .action-scene');if(svg){let line=svg.querySelector('[data-annotation]');if(line)line.remove();else{line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d','M290 130 L317 190 L284 266 M293 174 Q320 164 342 183');line.setAttribute('stroke','var(--wine)');line.setAttribute('stroke-width','3');line.setAttribute('fill','none');line.setAttribute('data-annotation','');svg.append(line);}}tell(app,'关键帧标注开关示意；正式编辑方式待方案确定后细化。');}
 else if(a==='s-inspector'){s.inspector=!s.inspector;render(app);}
 else if(a==='speed'){b.textContent=b.textContent.includes('0.5')?'1×':'0.5×';tell(app,'倍速控件状态预览。');}
 else if(a==='keyframe')tell(app,`已在示例第 ${s.frame} 帧添加关键帧标记。`);
 else if(a==='export')tell(app,'导出入口预览；不会写入相册或上传内容。');
 else tell(app,'此处为流程入口示意；本稿可体验首页、白板与视频分析。');
 });
 if(globalThis.Tweak){const options={comfortable:key==='buddy'};const tweak=new Tweak({container:app,onChange:()=>{app.style.fontSize=options.comfortable?'14px':'13px';}});tweak.addToggle(options,'comfortable',{label:'宽松文字密度'});}
 });
