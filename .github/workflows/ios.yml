name: iOS simulator verification
on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify static SDK packaging guards
        run: python3 -m unittest discover -s scripts -p 'test_mediapipe_static_packaging.py' -v
      - name: Verify iPhone and iPad
        run: python3 scripts/verify.py
      - name: Preserve simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-results
          path: artifacts/
          retention-days: 7
